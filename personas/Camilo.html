<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proyecto Arquitectónico: Camilo</title>

<!-- FUENTES MAS ARQUITECTONICAS -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=IBM+Plex+Mono:wght@300;500&display=swap" rel="stylesheet">

<style>

/* ================= FONDO CONCRETO + ATMOSFERA ================= */

body
{
    margin: 0;

    background:
    radial-gradient(circle at 60% 30%, rgba(255,255,255,0.04), transparent 60%),
    radial-gradient(circle at 30% 70%, rgba(0,150,255,0.05), transparent 60%),
    linear-gradient(180deg, #0a0c0f, #0f141a, #0a0c0f);

    font-family: 'Inter', sans-serif;

    color: #e6edf3;

    overflow-x: hidden;

    text-align: center;
}

/* ================= LINEAS ARQUITECTURALES MINIMALISTAS ================= */

.estructura
{
    position: fixed;

    inset: 0;

    pointer-events: none;
}

.linea
{
    position: absolute;

    background: rgba(255,255,255,0.08);
}

.linea.h
{
    height: 1px;
    width: 100%;
}

.linea.v
{
    width: 1px;
    height: 100%;
}

/* ================= BLOQUES ESTRUCTURA ================= */

.bloque
{
    position: fixed;

    border: 1px solid rgba(255,255,255,0.12);

    background: rgba(255,255,255,0.02);

    backdrop-filter: blur(4px);

    animation: aparecer 1.5s ease forwards;

    opacity: 0;
}

@keyframes aparecer
{
    to
    {
        opacity: 1;
    }
}

/* ================= PANEL ACCESO ================= */

#sobre
{
    margin-top: 260px;

    width: 340px;

    padding: 22px;

    border: 1px solid rgba(255,255,255,0.25);

    background: rgba(255,255,255,0.02);

    color: #cfd8e3;

    cursor: pointer;

    margin-left: auto;

    margin-right: auto;

    letter-spacing: 2px;

    transition: 0.3s;
}

#sobre:hover
{
    background: rgba(255,255,255,0.06);
}

/* ================= CONTENEDOR ================= */

.carta
{
    display: none;

    margin: auto;

    margin-top: 80px;

    max-width: 800px;

    padding: 60px;

    border: 1px solid rgba(255,255,255,0.15);

    background: rgba(10,14,18,0.75);

    backdrop-filter: blur(8px);
}

/* ================= TITULO ================= */

.titulo
{
    font-size: 42px;

    font-weight: 500;

    letter-spacing: 6px;

    margin-bottom: 40px;

    color: #ffffff;
}

/* ================= TEXTO ================= */

#textoCarta
{
    font-family: 'IBM Plex Mono', monospace;

    font-size: 18px;

    border-right: 2px solid rgba(255,255,255,0.4);

    white-space: pre-line;

    line-height: 1.8;
}

/* ================= FOTOS ================= */

.foto
{
    position: fixed;

    width: 200px;

    border: 1px solid rgba(255,255,255,0.2);

    opacity: 0;

    transition: opacity 1.5s;
}

.foto.visible
{
    opacity: 1;
}

.foto.izq
{
    left: 80px;
    bottom: 140px;
}

.foto.der
{
    right: 80px;
    bottom: 140px;
}

/* ================= BOTONES ================= */

.audios button
{
    margin: 14px;

    padding: 12px 20px;

    border: 1px solid rgba(255,255,255,0.25);

    background: transparent;

    color: #e6edf3;

    cursor: pointer;

    font-family: Inter;

    transition: 0.3s;
}

.audios button:hover
{
    background: rgba(255,255,255,0.08);
}

</style>

</head>

<body>

<div class="estructura">
<div class="linea h" style="top:20%"></div>
<div class="linea h" style="top:60%"></div>
<div class="linea v" style="left:25%"></div>
<div class="linea v" style="left:75%"></div>
</div>

<div class="bloque" style="top:15%;left:20%;width:200px;height:120px"></div>
<div class="bloque" style="top:55%;right:20%;width:240px;height:140px"></div>

<audio id="musica" loop>
<source src="../media/camilo/musica.mp3">
</audio>

<div id="sobre" onclick="abrirCarta()">
ACCEDER AL PROYECTO
</div>

<div class="carta" id="carta">

<h1 class="titulo">PROYECTO: CAMILO</h1>

<p id="textoCarta"></p>

<img src="../media/camilo/foto1.jpg" class="foto izq" id="foto1">
<img src="../media/camilo/foto2.jpg" class="foto der" id="foto2">

<div class="audios">
<button onclick="reproducirAudio('audio1')">REGISTRO 01</button>
<button onclick="reproducirAudio('audio2')">REGISTRO 02</button>
<button onclick="reproducirAudio('audio3')">REGISTRO 03</button>
</div>

<audio id="audio1"><source src="../media/camilo/audio1.mp3"></audio>
<audio id="audio2"><source src="../media/camilo/audio2.mp3"></audio>
<audio id="audio3"><source src="../media/camilo/audio3.mp3"></audio>

</div>

<script>

let audioActual=null;

function reproducirAudio(id)
{
    if(audioActual)
    {
        audioActual.pause();
        audioActual.currentTime=0;
    }

    audioActual=document.getElementById(id);

    audioActual.play();
}

function abrirCarta()
{
    sobre.style.display="none";

    carta.style.display="block";

    musica.volume=0;

    musica.play();

    let fade=setInterval(()=>{

        if(musica.volume<0.25)
            musica.volume+=0.01;

        else
            clearInterval(fade);

    },120);

    escribirTexto();
}

const texto=`PROYECTO IDENTIFICADO.

DISEÑO: ORIGINAL.

ESTRUCTURA: FIRME.

AUTOR: IRREPETIBLE.`;

let i=0;

function escribirTexto()
{
    if(i<texto.length)
    {
        textoCarta.innerHTML+=texto.charAt(i);

        i++;

        if(i==40)
            foto1.classList.add("visible");

        if(i==80)
            foto2.classList.add("visible");

        setTimeout(escribirTexto,35);
    }
}

</script>

</body>
</html>
