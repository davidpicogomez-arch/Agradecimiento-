<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Misión: Juanita</title>

<!-- TIPOGRAFIA ESTILO NASA -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Roboto+Mono:wght@300;500&display=swap" rel="stylesheet">

<style>

/* ================= ESPACIO PROFUNDO ================= */

body
{
    margin: 0;

    background:
    radial-gradient(circle at 50% 30%, rgba(0,120,255,0.15), transparent 60%),
    radial-gradient(circle at 80% 70%, rgba(255,120,0,0.12), transparent 60%),
    linear-gradient(180deg, #02040a, #050814, #02040a);

    font-family: 'Orbitron', sans-serif;

    color: #e6f0ff;

    overflow-x: hidden;

    text-align: center;
}

/* ================= ESTRELLAS ================= */

.estrella
{
    position: fixed;

    width: 2px;
    height: 2px;

    background: white;

    border-radius: 50%;

    animation: parpadear 3s infinite alternate;
}

@keyframes parpadear
{
    from { opacity: 0.2; }
    to { opacity: 1; }
}

/* ================= PLANETA TIERRA ================= */

.tierra
{
    position: fixed;

    bottom: -120px;

    left: 50%;

    transform: translateX(-50%);

    width: 600px;
    height: 300px;

    background: radial-gradient(circle at center, #0a3a8a, #020814);

    border-radius: 50%;

    box-shadow:
    0 0 120px rgba(0,120,255,0.4);
}

/* ================= PANEL PRINCIPAL ================= */

.panel
{
    display: none;

    margin: auto;

    margin-top: 80px;

    max-width: 800px;

    padding: 50px;

    border: 1px solid rgba(0,150,255,0.4);

    background: rgba(5,10,20,0.85);

    box-shadow:
    0 0 40px rgba(0,150,255,0.3);
}

/* ================= TITULO ================= */

.titulo
{
    font-size: 44px;

    letter-spacing: 6px;

    color: #4db3ff;

    text-shadow: 0 0 20px rgba(0,150,255,0.8);

    margin-bottom: 40px;
}

/* ================= TEXTO ================= */

#textoCarta
{
    font-family: 'Roboto Mono', monospace;

    font-size: 18px;

    border-right: 2px solid #4db3ff;

    white-space: pre-line;

    line-height: 1.8;
}

/* ================= BOTON ACCESO ================= */

#acceso
{
    margin-top: 260px;

    padding: 20px 40px;

    border: 1px solid rgba(0,150,255,0.6);

    background: rgba(0,50,120,0.2);

    color: #4db3ff;

    cursor: pointer;

    letter-spacing: 4px;

    transition: 0.3s;
}

#acceso:hover
{
    background: rgba(0,150,255,0.2);
}

/* ================= FOTOS ================= */

.foto
{
    position: fixed;

    width: 180px;

    border: 1px solid rgba(0,150,255,0.5);

    box-shadow: 0 0 20px rgba(0,150,255,0.5);

    opacity: 0;

    transition: opacity 2s;
}

.foto.visible
{
    opacity: 1;
}

.foto.izq
{
    left: 60px;

    bottom: 140px;
}

.foto.der
{
    right: 60px;

    bottom: 140px;
}

/* ================= BOTONES TRANSMISION ================= */

.audios button
{
    margin: 12px;

    padding: 12px 22px;

    border: 1px solid rgba(0,150,255,0.6);

    background: transparent;

    color: #4db3ff;

    cursor: pointer;

    font-family: Orbitron;
}

.audios button:hover
{
    background: rgba(0,150,255,0.2);
}

/* ================= INDICADOR SISTEMA ================= */

.estado
{
    position: fixed;

    top: 20px;

    right: 30px;

    font-size: 14px;

    color: #4db3ff;

    opacity: 0.8;
}

</style>

</head>

<body>

<div class="estado">SISTEMA: CONECTADO</div>

<div class="tierra"></div>

<audio id="musica" loop>
<source src="../media/juanita/musica.mp3">
</audio>

<div id="acceso" onclick="iniciarMision()">
INICIAR MISIÓN
</div>

<div class="panel" id="panel">

<h1 class="titulo">UNIDAD: JUANITA</h1>

<p id="textoCarta"></p>

<img src="../media/juanita/foto1.jpg" class="foto izq" id="foto1">
<img src="../media/juanita/foto2.jpg" class="foto der" id="foto2">

<div class="audios">
<button onclick="reproducirAudio('audio1')">TRANSMISIÓN 01</button>
<button onclick="reproducirAudio('audio2')">TRANSMISIÓN 02</button>
<button onclick="reproducirAudio('audio3')">TRANSMISIÓN PERSONAL</button>
</div>

<audio id="audio1"><source src="../media/juanita/audio1.mp3"></audio>
<audio id="audio2"><source src="../media/juanita/audio2.mp3"></audio>
<audio id="audio3"><source src="../media/juanita/audio3.mp3"></audio>

</div>

<script>

/* CREAR ESTRELLAS */

for(let i=0;i<150;i++)
{
    let e=document.createElement("div");

    e.className="estrella";

    e.style.left=Math.random()*100+"vw";

    e.style.top=Math.random()*100+"vh";

    document.body.appendChild(e);
}

let audioActual=null;

function reproducirAudio(id)
{
    if(audioActual)
    {
        audioActual.pause();
        audioActual.currentTime=0;
    }

    audioActual=document.getElementById(id);

    audioActual.play();
}

function iniciarMision()
{
    acceso.style.display="none";

    panel.style.display="block";

    musica.volume=0;

    musica.play();

    let fade=setInterval(()=>{

        if(musica.volume<0.25)
            musica.volume+=0.01;

        else
            clearInterval(fade);

    },120);

    escribirTexto();
}

const texto=`UNIDAD DETECTADA.

ESPECIALIDAD: MECATRÓNICA.

ESTADO: OPERATIVO.

DESTINO: NASA.`;

let i=0;

function escribirTexto()
{
    if(i<texto.length)
    {
        textoCarta.innerHTML+=texto.charAt(i);

        i++;

        if(i==40)
            foto1.classList.add("visible");

        if(i==80)
            foto2.classList.add("visible");

        setTimeout(escribirTexto,35);
    }
}

</script>

</body>
</html>
