<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOCAHO - CREATIVE CANVAS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(0, 255, 0, 0.03) 35px, rgba(0, 255, 0, 0.03) 70px);
            font-family: 'Poppins', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }
        
        /* Partículas de tinta/spray */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            pointer-events: none;
            animation: float-spray 20s linear infinite;
        }
        
        .particle {
            background: #00ff00;
            box-shadow: 0 0 5px #00ff00;
        }
        
        .particle:nth-child(odd) {
            background: #00dd00;
            box-shadow: 0 0 5px #00dd00;
        }
        
        .particle:nth-child(3n) {
            background: #00cc00;
            box-shadow: 0 0 5px #00cc00;
        }
        
        @keyframes float-spray {
            from {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            to {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
        
        /* ===== CANVAS INICIAL ===== */
        #canvas-inicial {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: #0a0a0a;
            animation: fade-out-canvas 0.8s ease forwards 8s;
        }
        
        @keyframes fade-out-canvas {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }
        
        .canvas-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Jordans decorativas */
        .jordan-deco {
            position: absolute;
            font-size: 80px;
            opacity: 0.1;
            animation: float-jordan 6s ease-in-out infinite;
        }
        
        .jordan-deco:nth-child(1) {
            top: 20px;
            left: 20px;
            animation-delay: 0s;
        }
        
        .jordan-deco:nth-child(2) {
            bottom: 30px;
            right: 20px;
            animation-delay: 2s;
        }
        
        @keyframes float-jordan {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        
        .canvas-box {
            width: 320px;
            height: 320px;
            border: 4px solid #00ff00;
            background: rgba(0, 255, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 30px #00ff00, inset 0 0 30px rgba(0, 255, 0, 0.1);
            cursor: pointer;
            animation: pulse-canvas 2s ease-in-out infinite;
        }
        
        @keyframes pulse-canvas {
            0%, 100% { box-shadow: 0 0 30px #00ff00, inset 0 0 30px rgba(0, 255, 0, 0.1); }
            50% { box-shadow: 0 0 50px #00ff00, inset 0 0 50px rgba(0, 255, 0, 0.2); }
        }
        
        .canvas-titulo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 42px;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00ff00;
            margin-bottom: 10px;
        }
        
        .canvas-subtitulo {
            font-size: 13px;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse-text 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse-text {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        
        /* ===== CONTENIDO PRINCIPAL ===== */
        .contenedor {
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 40px;
            display: none;
            animation: fade-in 1s ease;
        }
        
        .contenedor.visible {
            display: block;
        }
        
        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Título principal */
        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 72px;
            text-align: center;
            color: #00ff00;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #00ff00;
            font-weight: 700;
        }
        
        .subtitle {
            text-align: center;
            font-size: 16px;
            color: #00dd00;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        /* ===== SECCIÓN CREATIVA ===== */
        .creative-section {
            background: rgba(0, 255, 0, 0.05);
            border: 2px solid #00ff00;
            padding: 40px;
            margin-bottom: 60px;
            position: relative;
        }
        
        .creative-section::before {
            content: '✎ CANVAS CREATIVO';
            position: absolute;
            top: -12px;
            left: 20px;
            background: #0a0a0a;
            padding: 0 10px;
            font-family: 'Bebas Neue', sans-serif;
            color: #00ff00;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ff00;
        }
        
        .creative-section p {
            font-size: 13px;
            color: #00ff00;
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .creative-text {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid #00ff00;
            padding: 20px;
            color: #00ff00;
            font-size: 16px;
            line-height: 1.8;
            min-height: 120px;
            font-family: 'Poppins', sans-serif;
        }
        
        /* ===== SECCIÓN DE TRACKS ===== */
        .tracks-section {
            margin: 80px 0;
            text-align: center;
        }
        
        .tracks-section h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 44px;
            color: #00ff00;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #00ff00;
        }
        
        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .track-btn {
            padding: 20px;
            background: rgba(0, 255, 0, 0.08);
            border: 2px solid #00ff00;
            color: #00ff00;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }
        
        .track-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 0, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .track-btn:hover::before {
            left: 100%;
        }
        
        .track-btn:hover {
            background: rgba(0, 255, 0, 0.15);
            box-shadow: 0 0 20px #00ff00;
            transform: translateY(-5px);
            border-color: #00ff00;
        }
        
        /* ===== BOTÓN GALERÍA ===== */
        .btn-galeria {
            display: block;
            margin: 60px auto;
            padding: 20px 50px;
            background: #00ff00;
            border: 2px solid #00ff00;
            color: #0a0a0a;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 30px #00ff00;
            position: relative;
            overflow: hidden;
        }
        
        .btn-galeria::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
        }
        
        .btn-galeria:hover::before {
            left: 100%;
        }
        
        .btn-galeria:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 50px #00ff00;
            background: #00dd00;
        }
        
        /* ===== GALERÍA ARTÍSTICA ===== */
        .galeria {
            display: none;
            margin-top: 80px;
        }
        
        .galeria.activa {
            display: block;
            animation: fade-in 0.8s ease;
        }
        
        .galeria h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            color: #00ff00;
            text-align: center;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #00ff00;
        }
        
        .grid-fotos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }
        
        .foto-item {
            position: relative;
            aspect-ratio: 1;
            border: 3px solid #00ff00;
            overflow: hidden;
            cursor: pointer;
            opacity: 0;
            animation: fade-in 0.8s ease forwards;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            background: #0a0a0a;
        }
        
        .foto-item:nth-child(1) { animation-delay: 0.1s; }
        .foto-item:nth-child(2) { animation-delay: 0.2s; }
        .foto-item:nth-child(3) { animation-delay: 0.3s; }
        
        .foto-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.5s ease;
            filter: contrast(1.1) brightness(0.95);
        }
        
        .foto-item:hover {
            border-color: #00ff00;
            box-shadow: 0 0 40px #00ff00;
            transform: scale(1.05);
        }
        
        .foto-item:hover img {
            filter: contrast(1.3) brightness(1);
        }
        
        .foto-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.1), rgba(0, 200, 0, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #00ff00;
            font-size: 60px;
            color: #00ff00;
        }
        
        /* ===== LÍNEA DIVISORA ===== */
        .divider {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff00, transparent);
            margin: 80px 0;
            box-shadow: 0 0 20px #00ff00;
        }
        
        /* ===== BOTÓN VOLVER ===== */
        .volver {
            display: inline-block;
            margin-top: 60px;
            padding: 12px 40px;
            background: transparent;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }
        
        .volver:hover {
            background: #00ff00;
            color: #0a0a0a;
            box-shadow: 0 0 30px #00ff00;
            transform: translateY(-3px);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 48px; }
            
            .tracks-grid {
                grid-template-columns: 1fr;
            }
            
            .grid-fotos {
                grid-template-columns: 1fr;
            }
            
            .contenedor {
                padding: 60px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- CANVAS INICIAL -->
    <div id="canvas-inicial">
        <div class="canvas-wrapper" onclick="activarCanvas()">
            <div class="jordan-deco">👟</div>
            <div class="jordan-deco">👟</div>
            
            <div class="canvas-box">
                <div class="canvas-titulo">BOCAHO</div>
                <div class="canvas-subtitulo">● CREATIVE MODE ●</div>
            </div>
        </div>
    </div>

    <!-- PARTÍCULAS SPRAY -->
    <div id="particulas"></div>

    <!-- MÚSICA DE FONDO -->
    <audio id="musica" loop volume="0.15">
        <source src="../media/Bocaho/musica.mp3" type="audio/mpeg">
    </audio>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="contenedor" id="contenedor">
        
        <h1>BOCAHO</h1>
        <p class="subtitle">🎨 Creative Canvas Unlocked 🎨</p>

        <!-- CANVAS CREATIVO -->
        <div class="creative-section">
            <p>tu espacio creativo</p>
            <div class="creative-text" id="mensaje-personalizado">
                La creatividad no tiene límites,
                como la música que te mueve.
                <br><br>
                Bienvenido a tu galería personal.
            </div>
        </div>

        <div class="divider"></div>

        <!-- TRACKS -->
        <div class="tracks-section">
            <h2>🎵 PLAYLIST EXCLUSIVA</h2>
            <div class="tracks-grid">
                <button class="track-btn" onclick="reproducirAudio('audio1')">
                    ▶ Mensaje 1
                </button>
                <button class="track-btn" onclick="reproducirAudio('audio2')">
                    ▶ Mensaje 2
                </button>
                <button class="track-btn" onclick="reproducirAudio('audio3')">
                    ▶ Mensaje 3
                </button>
            </div>

            <button class="btn-galeria" onclick="abrirGaleria()">
                🎨 VER GALERÍA CREATIVA 🎨
            </button>
        </div>

        <!-- GALERÍA -->
        <div class="galeria" id="galeria">
            <h2>GALERÍA PERSONAL</h2>
            <div class="grid-fotos">
                <div class="foto-item">
                    <div class="foto-placeholder">🎨</div>
                </div>

                <div class="foto-item">
                    <div class="foto-placeholder">🎨</div>
                </div>

                <div class="foto-item">
                    <div class="foto-placeholder">🎨</div>
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="../index.html" class="volver">SALIR</a>
        </div>

    </div>

    <!-- AUDIOS -->
    <audio id="audio1"><source src="../media/Bocaho/audio1.mp3" type="audio/mpeg"></audio>
    <audio id="audio2"><source src="../media/Bocaho/audio2.mp3" type="audio/mpeg"></audio>
    <audio id="audio3"><source src="../media/Bocaho/audio3.mp3" type="audio/mpeg"></audio>

    <script>
        // Generar partículas spray
        function generarParticulas() {
            const contenedor = document.getElementById('particulas');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (15 + Math.random() * 15) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                contenedor.appendChild(particle);
            }
        }
        generarParticulas();

        // Control de audio
        let audioActual = null;

        function reproducirAudio(id) {
            if (audioActual && !audioActual.paused) {
                audioActual.pause();
                audioActual.currentTime = 0;
                document.querySelectorAll('.track-btn').forEach(btn => {
                    btn.style.opacity = '1';
                });
            }

            audioActual = document.getElementById(id);
            audioActual.play();
            event.target.style.opacity = '0.7';
            
            audioActual.addEventListener('ended', () => {
                event.target.style.opacity = '1';
            });
        }

        // Activar canvas
        function activarCanvas() {
            document.getElementById('canvas-inicial').style.display = 'none';
            document.getElementById('contenedor').classList.add('visible');

            // Iniciar música
            const musica = document.getElementById('musica');
            musica.play();
        }

        // Abrir galería
        function abrirGaleria() {
            const galeria = document.getElementById('galeria');
            galeria.classList.toggle('activa');
            
            setTimeout(() => {
                galeria.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }
    </script>

</body>
</html>
